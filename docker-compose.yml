services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload  # restarts when a file in app/ changes
    volumes: ["./backend/app:/app/app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"  # the reload also works on Windows and macOS shared folders
    env_file: .env
    ports: ["${BACKEND_PORT:-8000}:8000"]
  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-3000}:80"]
    depends_on: [backend]
